---
name: Bug report
description: Report incorrect behavior or a crash.
title: "bug: "
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >-
        Include the smallest source file and command that reproduce
        the problem.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: vX.Y.Z or commit SHA
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS arm64 or Linux x64
    validations:
      required: true
