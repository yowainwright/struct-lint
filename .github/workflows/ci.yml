---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check shell scripts
        run: shellcheck scripts/*.sh scripts/hooks/* tests/e2e/*.sh

      - name: Test
        run: ./scripts/check.sh

      - name: Benchmark
        run: ./scripts/benchmark.sh

      - name: Verify release archive
        run: |
          tar -czf .build/release.tar.gz LICENSE LICENSES -C .build struct-lint
          ./tests/e2e/test-release.sh .build/release.tar.gz
