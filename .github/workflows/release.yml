---
name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SL_VERSION: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-amd64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            artifact: linux-arm64
          - name: macOS ARM64
            os: macos-15
            artifact: darwin-arm64
          - name: macOS x64
            os: macos-15-intel
            artifact: darwin-amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: ./scripts/check.sh

      - name: Verify release version
        run: |
          version="$(.build/struct-lint --version)"
          test "$GITHUB_REF_NAME" = "v${version#struct-lint }"

      - name: Package binary
        env:
          ARCHIVE: struct-lint-${{ matrix.artifact }}.tar.gz
        run: |
          mkdir -p dist
          tar -czf "dist/$ARCHIVE" LICENSE LICENSES -C .build struct-lint
          ./tests/e2e/test-release.sh "dist/$ARCHIVE"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --generate-notes --verify-tag
